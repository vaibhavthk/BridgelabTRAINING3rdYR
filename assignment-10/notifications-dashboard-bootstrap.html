<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Notifications Dashboard</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link rel='stylesheet' href='notifications-dashboard-bootstrap.css'></head><body><main class='container py-4'><!-- card and spacing utilities group dashboard alerts cleanly --><h1 class='h3 mb-3'>Notifications</h1><div class='card p-3'><div class='alert alert-success' role='alert'>Success: Profile updated.</div><div class='alert alert-info' role='alert'>Info: New message received.</div><div class='alert alert-danger' role='alert'>Danger: Payment failed.</div><div class='alert alert-warning' role='alert'><!-- alert class gives contextual notification styles -->Please verify your email.</div><section class='bg-light border rounded p-3'><h2 class='h6'>Summary</h2><p class='mb-0'>3 active alerts and 1 pending action.</p></section></div></main></body></html>
