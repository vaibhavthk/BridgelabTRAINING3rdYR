<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Responsive Principles Summary</title><link rel='stylesheet' href='responsive-principles-summary.css'></head><body><main class='grid'><article><h1>Fluid Layouts</h1><p>Use relative widths like % and fr.</p><code>grid-template-columns: 1fr 1fr;</code></article><article><h2>Flexible Media</h2><p>Scale images with max-width: 100%.</p><code>img{max-width:100%;}</code></article><article><h2>Breakpoints</h2><p>Use media queries for layout shifts.</p><code>@media(max-width:600px){...}</code></article></main></body></html>
