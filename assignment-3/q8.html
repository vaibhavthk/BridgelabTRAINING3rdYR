<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f3f6fb; color: #1f2937; margin: 0; padding: 24px;">
<div style="max-width: 1100px; margin: 0 auto; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 28px; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);">
    <h1 style="color: #0f172a; margin-top: 0; margin-bottom: 12px;">Green Valley School</h1>
    <table style="border-collapse: collapse; width: 100%; margin: 12px 0; background: #fff; border: 1px solid #dfe7f2;" border="1" cellpadding="8" cellspacing="0" title="Student marks summary">
        <tr>
            <th style="background: #eef4ff; color: #0f172a; padding: 10px; border: 1px solid #dfe7f2; text-align: left;" rowspan="2">Student</th>
            <th style="background: #eef4ff; color: #0f172a; padding: 10px; border: 1px solid #dfe7f2; text-align: left;" colspan="5">Subjects</th>
            <th style="background: #eef4ff; color: #0f172a; padding: 10px; border: 1px solid #dfe7f2; text-align: left;" rowspan="2">Total</th>
            <th style="background: #eef4ff; color: #0f172a; padding: 10px; border: 1px solid #dfe7f2; text-align: left;" rowspan="2">Percentage</th>
        </tr>
        <tr>
            <th style="background: #eef4ff; color: #0f172a; padding: 10px; border: 1px solid #dfe7f2; text-align: left;">Math</th>
            <th style="background: #eef4ff; color: #0f172a; padding: 10px; border: 1px solid #dfe7f2; text-align: left;">Science</th>
            <th style="background: #eef4ff; color: #0f172a; padding: 10px; border: 1px solid #dfe7f2; text-align: left;">English</th>
            <th style="background: #eef4ff; color: #0f172a; padding: 10px; border: 1px solid #dfe7f2; text-align: left;">History</th>
            <th style="background: #eef4ff; color: #0f172a; padding: 10px; border: 1px solid #dfe7f2; text-align: left;">Computer</th>
        </tr>
        <tr>
            <td style="padding: 10px; border: 1px solid #dfe7f2; vertical-align: top;">Vaibhav</td>
            <td style="padding: 10px; border: 1px solid #dfe7f2; vertical-align: top;">90</td>
            <td style="padding: 10px; border: 1px solid #dfe7f2; vertical-align: top;">88</td>
            <td style="padding: 10px; border: 1px solid #dfe7f2; vertical-align: top;">85</td>
            <td style="padding: 10px; border: 1px solid #dfe7f2; vertical-align: top;">80</td>
            <td style="padding: 10px; border: 1px solid #dfe7f2; vertical-align: top;">95</td>
            <td style="padding: 10px; border: 1px solid #dfe7f2; vertical-align: top;">438</td>
            <td style="padding: 10px; border: 1px solid #dfe7f2; vertical-align: top;">87.6%</td>
        </tr>
    </table>
</div>
</body>
</html>
