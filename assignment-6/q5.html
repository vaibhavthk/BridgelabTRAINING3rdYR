<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q5 - Pricing Flexbox</title>
  <link rel="stylesheet" href="q5.css">
</head>
<body>
  <main class="pricing">
    <article class="card">
      <h2>Basic</h2>
      <p class="price">₹499/mo</p>
      <p>For starters and practice users.</p>
    </article>

    <article class="card featured">
      <h2>Standard</h2>
      <p class="price">₹999/mo</p>
      <p>Best for students and regular projects.</p>
    </article>

    <article class="card">
      <h2>Premium</h2>
      <p class="price">₹1499/mo</p>
      <p>For advanced users and teams.</p>
    </article>
  </main>
</body>
</html>
