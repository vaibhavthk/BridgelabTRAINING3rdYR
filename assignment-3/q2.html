<!DOCTYPE html>
<html lang="en">
<head>

    <title>Product Catalog</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f3f6fb; color: #1f2937; margin: 0; padding: 24px;">
<div style="max-width: 1100px; margin: 0 auto; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 28px; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);">
    <h1 style="color: #0f172a; margin-top: 0; margin-bottom: 12px;">Product Catalog</h1>
    <table style="border-collapse: collapse; width: 100%; margin: 12px 0; background: #fff; border: 1px solid #dfe7f2;" border="1" cellpadding="10" cellspacing="0" width="100%">

        </thead>

            </tr>
