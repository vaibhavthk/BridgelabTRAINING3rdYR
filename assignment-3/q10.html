<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Selection</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f3f6fb; color: #1f2937; margin: 0; padding: 24px;">
<div style="max-width: 1100px; margin: 0 auto; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 28px; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);">
    <h1 style="color: #0f172a; margin-top: 0; margin-bottom: 12px;">Choose Your Travel Preferences</h1>

    <label for="country">Country:</label>
    <select style="padding: 8px 10px; margin: 6px 0 12px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box;" id="country" name="country">
        <option value="india" selected>India</option>
        <option value="france">France</option>
        <option value="japan">Japan</option>
    </select><br><br>

    <label for="state">State:</label>
    <select style="padding: 8px 10px; margin: 6px 0 12px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box;" id="state" name="state">
        <option value="maharashtra" selected>Maharashtra</option>
        <option value="karnataka">Karnataka</option>
        <option value="delhi">Delhi</option>
    </select><br><br>

    <label for="city">City:</label>
    <select style="padding: 8px 10px; margin: 6px 0 12px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box;" id="city" name="city">
        <option value="pune" selected>Pune</option>
        <option value="mumbai">Mumbai</option>
        <option value="bangalore">Bangalore</option>
    </select><br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select style="padding: 8px 10px; margin: 6px 0 12px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box;" id="place" name="place">
        <option value="gateway" selected>Gateway of India</option>
        <option value="eiffel">Eiffel Tower</option>
        <option value="mtfuji">Mount Fuji</option>
    </select>

    <p style="line-height: 1.7; margin: 10px 0;">You selected India, Maharashtra, Pune, and Gateway of India.</p>
</div>
</body>
</html>
