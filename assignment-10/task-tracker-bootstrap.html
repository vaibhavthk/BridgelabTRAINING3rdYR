<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Task Tracker</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link rel='stylesheet' href='task-tracker-bootstrap.css'></head><body><main class='container py-4'><!-- list-group and badges provide structured task priority UI --><div class='d-flex justify-content-between align-items-center mb-3'><h1 class='h3 mb-0'>Task Tracker</h1><span class='badge bg-secondary'>Pending: 3</span></div><ul class='list-group'><li class='list-group-item d-flex justify-content-between align-items-center'>Design login page<span class='badge bg-danger'>High</span></li><li class='list-group-item d-flex justify-content-between align-items-center'>Update docs<span class='badge bg-warning text-dark'>Medium</span></li><li class='list-group-item d-flex justify-content-between align-items-center'>Refactor footer<span class='badge bg-success'>Low</span></li></ul><button class='btn btn-primary mt-3'>Completed <span class='badge text-bg-light'>1</span></button></main></body></html>
