<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Travel Showcase</title><link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'><link rel='stylesheet' href='travel-showcase-carousel-bootstrap.css'></head><body><main class='container py-4'><h1 class='text-center mb-4'>Travel Showcase</h1><div id='travelCarousel' class='carousel slide mb-4' data-bs-ride='carousel'><!-- carousel component with captions --><div class='carousel-inner rounded'><div class='carousel-item active' data-bs-interval='2000'><img src='https://picsum.photos/seed/trv1/900/420' class='d-block w-100' alt='Mountain destination'><div class='carousel-caption'><h2 class='h5'>Mountains</h2></div></div><div class='carousel-item' data-bs-interval='2500'><img src='https://picsum.photos/seed/trv2/900/420' class='d-block w-100' alt='Beach destination'><div class='carousel-caption'><h2 class='h5'>Beaches</h2></div></div><div class='carousel-item' data-bs-interval='3000'><img src='https://picsum.photos/seed/trv3/900/420' class='d-block w-100' alt='City destination'><div class='carousel-caption'><h2 class='h5'>City Lights</h2></div></div></div><button class='carousel-control-prev' type='button' data-bs-target='#travelCarousel' data-bs-slide='prev'><span class='carousel-control-prev-icon' aria-hidden='true'></span><span class='visually-hidden'>Previous</span></button><button class='carousel-control-next' type='button' data-bs-target='#travelCarousel' data-bs-slide='next'><span class='carousel-control-next-icon' aria-hidden='true'></span><span class='visually-hidden'>Next</span></button></div><div class='progress mb-3' role='progressbar' aria-label='Trip completion'><div class='progress-bar progress-bar-striped progress-bar-animated bg-success' style='width: 70%'>70%</div></div></main><footer class='text-center py-3 bg-light'>Contact: travel@example.com</footer><script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'></script></body></html>
